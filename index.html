<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCO STREAM - Ultimate UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

        /* --- VARIABLES ULTRA-PREMIUM --- */
        :root {
            --bg-body: #010308;
            --bg-card: rgba(10, 15, 30, 0.4);
            --bg-panel: rgba(5, 10, 20, 0.55);
            --bg-header: rgba(1, 3, 8, 0.75);
            --accent: #00f2fe;
            --highlight: #4facfe;
            --text-main: #ffffff;
            --text-sub: #8b9bb4;
            --glass: blur(24px) saturate(200%);
            --border-light: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(0, 242, 254, 0.3);
            --shadow-core: 0 20px 50px rgba(0, 0, 0, 0.8);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ARRIERE-PLAN HOLOGRAPHIQUE & ANIMÉ --- */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(79, 172, 254, 0.05), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0, 242, 254, 0.05), transparent 30%);
            z-index: -1;
            pointer-events: none;
            animation: ambientGlow 20s ease-in-out infinite alternate;
        }

        @keyframes ambientGlow {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(5deg) scale(1.1); }
        }

        /* --- HEADER BIONIQUE --- */
        header {
            background: var(--bg-header);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            padding: 18px 50px;
            position: sticky;
            top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 30px; font-weight: 900; letter-spacing: -1.5px;
            background: linear-gradient(135deg, #fff 20%, var(--accent) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
        }

        header h1:hover { 
            transform: scale(1.03); 
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }

        .search-container {
            position: relative;
            width: 100%; max-width: 450px;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px 14px 50px;
            border-radius: 40px; 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            font-size: 15px; font-weight: 500;
            transition: var(--transition);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .search-input:focus {
            background: rgba(0, 242, 254, 0.03);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15), inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .search-icon {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%);
            color: var(--accent); font-size: 16px;
            pointer-events: none;
            opacity: 0.7;
        }

        main {
            padding: 50px; max-width: 1500px; margin: 0 auto;
        }

        /* --- ANIMATIONS DES VUES --- */
        .page-view {
            display: none;
            animation: viewEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .active-view { display: block; }

        .section-title {
            font-size: 38px; font-weight: 900; margin-bottom: 35px;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- GRILLE ACCUEIL (CARTES 3D GLASS) --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 35px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            box-shadow: var(--shadow-core);
            border: 1px solid var(--border-light);
        }

        /* Effet de brillance interne */
        .card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            opacity: 0; transition: var(--transition); pointer-events: none;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 242, 254, 0.15);
            border-color: var(--border-glow);
        }

        .card:hover::after { opacity: 1; }

        .card-img-wrapper {
            position: relative; width: 100%; padding-top: 145%;
            overflow: hidden;
        }

        .card img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover img { transform: scale(1.1); filter: brightness(1.1); }

        .card-content {
            padding: 20px;
            background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.9) 60%, transparent 100%);
            position: absolute; bottom: 0; left: 0; width: 100%;
        }

        .card-title {
            font-size: 17px; font-weight: 800; letter-spacing: -0.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* --- PAGE DÉTAIL ANIMÉ (ONGLETS NEO) --- */
        .btn-back {
            background: rgba(255,255,255,0.03); color: var(--text-sub);
            border: 1px solid var(--border-light); padding: 12px 28px; border-radius: 40px;
            cursor: pointer; margin-bottom: 40px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 10px;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .btn-back:hover { 
            background: var(--accent); color: #000; 
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            transform: translateX(-5px);
        }

        .anime-detail-header {
            display: flex; gap: 50px; margin-bottom: 50px;
            background: var(--bg-panel);
            padding: 40px; border-radius: 30px;
            border: 1px solid var(--border-light);
            backdrop-filter: var(--glass);
        }

        @media (max-width: 768px) {
            .anime-detail-header { flex-direction: column; padding: 20px; }
        }

        .detail-poster {
            width: 280px; border-radius: 20px;
            box-shadow: var(--shadow-core); flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .anime-info h2 { font-size: 54px; font-weight: 900; margin-bottom: 25px; line-height: 1; letter-spacing: -2px; }
        .anime-resume { font-size: 17px; color: var(--text-sub); line-height: 1.8; font-weight: 400; }

        /* Onglets Ultra-fluides */
        .tabs-container {
            display: flex; gap: 15px; margin-bottom: 30px;
            overflow-x: auto; padding-bottom: 15px;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg-card); border: 1px solid var(--border-light);
            color: var(--text-sub); padding: 14px 28px;
            border-radius: 14px; font-weight: 800; cursor: pointer;
            transition: var(--transition); white-space: nowrap;
        }

        .tab-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .tab-btn.active {
            background: var(--accent);
            color: #000; border-color: transparent;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.25);
        }

        /* Grille Épisodes */
        .episodes-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: var(--bg-card); border: 1px solid var(--border-light);
            padding: 20px; border-radius: 16px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }

        .episode-card:hover {
            background: rgba(0, 242, 254, 0.05);
            border-color: var(--border-glow);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .ep-info { display: flex; flex-direction: column; gap: 6px; }
        .ep-num { font-size: 13px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .ep-title { font-size: 16px; font-weight: 700; color: #fff;}
        
        .badge {
            padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 900;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);
        }
        .badge.vf { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .badge.vostfr { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

        /* --- LECTEUR UNIQUE & HUD HOLOGRAPHIQUE --- */
        .player-layout { max-width: 1200px; margin: 0 auto; }
        
        .player-top-info { text-align: center; margin-bottom: 30px; }
        .player-top-info h2 { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: -1px;}
        .player-top-info p { color: var(--accent); font-weight: 700; font-size: 15px; letter-spacing: 1px; }

        .player-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0;
            background: #000; border-radius: 20px; overflow: hidden;
            box-shadow: var(--shadow-core), 0 0 40px rgba(0, 242, 254, 0.1); 
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* Centre de commande HUD */
        .command-center {
            background: var(--bg-panel); backdrop-filter: var(--glass);
            border: 1px solid var(--border-light); border-radius: 24px; padding: 35px;
            display: flex; flex-direction: column; gap: 25px;
            box-shadow: inset 0 2px 20px rgba(255,255,255,0.02), 0 20px 40px rgba(0,0,0,0.6);
        }

        .nav-buttons {
            display: flex; justify-content: space-between; gap: 20px;
        }

        .nav-btn {
            flex: 1; background: rgba(255,255,255,0.03); color: var(--text-main);
            border: 1px solid var(--border-light); padding: 18px; border-radius: 16px;
            font-weight: 800; font-size: 14px; cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 12px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--accent); color: #000; border-color: transparent;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
            transform: translateY(-3px);
        }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        /* Pilules Futuristes */
        .quick-select-row {
            display: flex; align-items: center; gap: 20px;
        }

        .quick-select-label { font-weight: 900; color: var(--text-sub); width: 85px; flex-shrink: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;}
        
        .pill-container {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none; 
        }
        .pill-container::-webkit-scrollbar { display: none; }

        .pill {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-light); color: var(--text-sub);
            padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: var(--transition); white-space: nowrap;
        }

        .pill:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.2); }
        .pill.active { 
            background: #fff; color: #000; border-color: transparent; 
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

    <header>
        <h1 onclick="router.home()">ORCO STREAM</h1>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher un animé..." oninput="handleSearch(this.value)">
        </div>
    </header>

    <main id="app">
        <!-- VUE ACCUEIL -->
        <div id="view-home" class="page-view active-view">
            <h2 class="section-title">Découvrir</h2>
            <div class="grid" id="home-grid"></div>
        </div>

        <!-- VUE DETAIL ANIME -->
        <div id="view-anime" class="page-view">
            <button class="btn-back" onclick="router.home()">← Retour à l'accueil</button>
            <div id="anime-detail-content"></div>

        <!-- VUE PLAYER -->
        <div id="view-player" class="page-view">
            <button class="btn-back" id="player-to-anime-btn">← Fiche de l'animé</button>
            
            <div class="player-layout">
                <div class="player-top-info">
                    <h2 id="player-anime-name"></h2>
                    <p id="player-ep-info"></p>
                </div>

                <div class="player-wrapper" id="player-wrapper">
                    <!-- L'iframe est générée ici dynamiquement par le JS pour l'Anti-Flag -->
                </div>

                <!-- LE CENTRE DE CONTROLE UNIQUE -->
                <div class="command-center">
                    
                    <div class="nav-buttons">
                        <button id="btn-prev" class="nav-btn" onclick="navigateEpisode(-1)">◄ Épisode Précédent</button>
                        <button id="btn-next" class="nav-btn" onclick="navigateEpisode(1)">Épisode Suivant ►</button>
                    </div>

                    <div class="quick-select-row">
                        <span class="quick-select-label">Saison</span>
                        <div class="pill-container" id="player-season-pills"></div>
                    </div>

                    <div class="quick-select-row">
                        <span class="quick-select-label">Épisode</span>
                        <div class="pill-container" id="player-episode-pills"></div>
                    </div>

                </div>
            </div>
        </div>
    </main>

        /* --- ETAT DE L'APPLICATION --- */
        let currentAnimeId = null;
        let activeTabSeasonIndex = 0; 
        
        let playerSeasonIndex = 0; 
        let playerEpisodeIndex = 0; 

        /* --- ROUTER --- */
        const router = {
            _showView(viewId) {
                document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active-view'));
                document.getElementById(viewId).classList.add('active-view');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            home() {
                document.getElementById('search-input').value = "";
                renderHome(database);
                this._showView('view-home');
                document.getElementById('player-wrapper').innerHTML = ""; // Coupe la vidéo
            },
            anime(animeId) {
                currentAnimeId = animeId;
                activeTabSeasonIndex = 0; 
                renderAnimeDetail();
                this._showView('view-anime');
                document.getElementById('player-wrapper').innerHTML = ""; // Coupe la vidéo
            },
            player(animeId, sIndex, epIndex) {
                currentAnimeId = animeId;
                playerSeasonIndex = sIndex;
                playerEpisodeIndex = epIndex;
                document.getElementById('player-to-anime-btn').onclick = () => this.anime(animeId);
                updatePlayerView();
                this._showView('view-player');
            }
        };

        /* --- RECHERCHE --- */
        function handleSearch(query) {
            router._showView('view-home');
            const cleanQuery = query.toLowerCase().trim();
            const filtered = database.filter(a => a.title.toLowerCase().includes(cleanQuery));
            renderHome(filtered);
        }

        /* --- RENDU ACCUEIL --- */
        function renderHome(list) {
            const grid = document.getElementById('home-grid');
            grid.innerHTML = "";
            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-sub); font-size: 18px;">Aucun résultat trouvé.</div>`;
                return;
            }
            list.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => router.anime(anime.id);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${anime.image}" alt="${anime.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${anime.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        /* --- RENDU PAGE ANIME (ONGLETS) --- */
        function renderAnimeDetail() {
            const anime = database.find(a => a.id === currentAnimeId);
            const container = document.getElementById('anime-detail-content');
            
            let tabsHtml = `<div class="tabs-container">`;
            anime.seasons.forEach((season, index) => {
                const isActive = index === activeTabSeasonIndex ? 'active' : '';
                tabsHtml += `<button class="tab-btn ${isActive}" onclick="changeSeasonTab(${index})">Saison ${season.season_number}</button>`;
            });
            tabsHtml += `</div>`;
            tabsHtml += `<div id="episodes-container" class="episodes-grid"></div>`;

            container.innerHTML = `
                <div class="anime-detail-header">
                    <img src="${anime.image}" alt="${anime.title}" class="detail-poster">
                    <div class="anime-info">
                        <h2>${anime.title}</h2>
                        <p class="anime-resume">${anime.resume}</p>
                    </div>
                </div>
                <h3 class="section-title" style="font-size: 28px;">Épisodes</h3>
                ${tabsHtml}
            `;
            renderEpisodesForTab();
        }

        function changeSeasonTab(index) {
            activeTabSeasonIndex = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderEpisodesForTab();
        }

        function renderEpisodesForTab() {
            const anime = database.find(a => a.id === currentAnimeId);
            const season = anime.seasons[activeTabSeasonIndex];
            const epContainer = document.getElementById('episodes-container');
            
            let html = "";
            season.episodes.forEach((ep, epIndex) => {
                html += `
                    <div class="episode-card" onclick="router.player('${anime.id}', ${activeTabSeasonIndex}, ${epIndex})">
                        <div class="ep-info">
                            <span class="ep-num">Épisode ${ep.number}</span>
                            <span class="ep-title">${ep.title}</span>
                        </div>
                        <span class="badge ${ep.lang.toLowerCase()}">${ep.lang}</span>
                    </div>
                `;
            });
            epContainer.innerHTML = html;
        }

        /* --- LOGIQUE DU LECTEUR ET SYSTEME ANTI-FLAG --- */
        function updatePlayerView() {
            const anime = database.find(a => a.id === currentAnimeId);
            const season = anime.seasons[playerSeasonIndex];
            const episode = season.episodes[playerEpisodeIndex];

            document.getElementById('player-anime-name').textContent = anime.title;
            document.getElementById('player-ep-info').textContent = `SAISON ${season.season_number} • ÉPISODE ${episode.number} • ${episode.lang}`;
            
            // ==========================================
            // SYSTEME ANTI-FLAG SIBNET (BYPASS FRONTEND)
            // ==========================================
            const wrapper = document.getElementById('player-wrapper');
            // On détruit l'ancien lecteur pour vider la mémoire et éviter la détection d'historique
            wrapper.innerHTML = ""; 
            
            // On recrée l'iframe proprement avec des règles strictes
            const iframe = document.createElement('iframe');
            iframe.src = `https://video.sibnet.ru/shell.php?videoid=${episode.sibnetId}`;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.style.position = "absolute";
            iframe.style.top = "0";
            iframe.style.left = "0";
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "0";
            
            // Attributs cruciaux pour empêcher Sibnet de savoir sur quel site vous êtes
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
            
            wrapper.appendChild(iframe);
            // ==========================================

            // Générer les pilules de Saison
            const seasonPills = document.getElementById('player-season-pills');
            seasonPills.innerHTML = "";
            anime.seasons.forEach((s, idx) => {
                const isActive = idx === playerSeasonIndex ? 'active' : '';
                seasonPills.innerHTML += `<div class="pill ${isActive}" onclick="jumpToSeason(${idx})">S${s.season_number}</div>`;
            });

            // Générer les pilules d'Épisode
            const epPills = document.getElementById('player-episode-pills');
            epPills.innerHTML = "";
            season.episodes.forEach((e, idx) => {
                const isActive = idx === playerEpisodeIndex ? 'active' : '';
                epPills.innerHTML += `<div class="pill ${isActive}" onclick="jumpToEpisode(${idx})">${e.number}</div>`;
            });

            // Centrer la pilule active
            setTimeout(() => {
                const activeEpPill = epPills.querySelector('.active');
                if(activeEpPill) activeEpPill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 50);

            // Gérer l'état des boutons Précédent/Suivant
            const isFirst = (playerSeasonIndex === 0 && playerEpisodeIndex === 0);
            const isLast = (playerSeasonIndex === anime.seasons.length - 1 && playerEpisodeIndex === season.episodes.length - 1);
            
            document.getElementById('btn-prev').disabled = isFirst;
            document.getElementById('btn-next').disabled = isLast;
        }

        function jumpToSeason(sIndex) {
            playerSeasonIndex = sIndex;
            playerEpisodeIndex = 0; 
            updatePlayerView();
        }

        function jumpToEpisode(epIndex) {
            playerEpisodeIndex = epIndex;
            updatePlayerView();
        }

        function navigateEpisode(direction) {
            const anime = database.find(a => a.id === currentAnimeId);
            let season = anime.seasons[playerSeasonIndex];

            if (direction === 1) { 
                if (playerEpisodeIndex < season.episodes.length - 1) {
                    playerEpisodeIndex++;
                } else if (playerSeasonIndex < anime.seasons.length - 1) {
                    playerSeasonIndex++;
                    playerEpisodeIndex = 0;
                }
            } else if (direction === -1) { 
                if (playerEpisodeIndex > 0) {
                    playerEpisodeIndex--;
                } else if (playerSeasonIndex > 0) {
                    playerSeasonIndex--;
                    playerEpisodeIndex = anime.seasons[playerSeasonIndex].episodes.length - 1;
                }
            }
            updatePlayerView();
        }

        /* --- INITIALISATION --- */
        renderHome(database);
    </script>
